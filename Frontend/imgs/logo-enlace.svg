<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 200" width="580" height="200">
  <defs>
    <linearGradient id="goldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0C477"/>
      <stop offset="100%" stop-color="#C8A951"/>
    </linearGradient>
    <linearGradient id="sageRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B7C39E"/>
      <stop offset="100%" stop-color="#A3B18A"/>
    </linearGradient>
  </defs>

  <!-- Dois anéis entrelaçados (ampliados) -->
  <g transform="translate(105,100)">
    <circle cx="-22" cy="0" r="48" fill="none" stroke="url(#goldRing)" stroke-width="13"/>
    <circle cx="22" cy="0" r="48" fill="none" stroke="url(#sageRing)" stroke-width="13"/>
  </g>

  <!-- Wordmark -->
  <text x="200" y="100" font-family="'Playfair Display', Georgia, serif" font-size="50" font-weight="500" fill="#1F1F1F">Enlace</text>
  <text x="202" y="128" font-family="Inter, Arial, sans-serif" font-size="13" letter-spacing="3" fill="#8a8a8a">PLANEJAMENTO DE CASAMENTO</text>
</svg>
